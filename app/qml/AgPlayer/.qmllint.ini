[Warnings]
# C++ objects are registered by qml_registration.cpp at process startup.
# The static linter cannot inspect qmlRegisterSingletonInstance() or
# qmlRegisterType(), while native QML tests exercise those real registrations.
ImportFailure=disable
UnresolvedType=disable
MissingProperty=disable
UnqualifiedAccess=disable
# SettingRow exposes its regular Item child through a default property alias.
# Qt 6.7's static layout plugin does not follow that alias and incorrectly
# treats the embedded controls as direct RowLayout children.  Runtime tests
# exercise the real parentage; keep plugin-only diagnostics out of the gate.
LintPluginWarnings=disable

[General]
DisableDefaultImports=false
