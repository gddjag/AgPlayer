<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0811">
  <meta name="description" content="自愿支持 AgPlayer 持续开发。全部功能永久免费，赞助不解锁功能或权益。">
  <title>支持作者 · AgPlayer</title>
  <link rel="icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="assets/css/site.css?v=20260908-qr-safari">
  <link rel="stylesheet" href="assets/css/premium-about.css?v=20260907-premium-1">
  <style>
    body { margin: 0; background: #0b0811; }
    .about-support { min-height: 100vh; box-sizing: border-box; border: 0; }
  </style>
</head>
<body data-page="about">
  <main id="main">
    <section class="about-support" aria-labelledby="support-title">
      <div class="container support-content">
        <p class="about-eyebrow">一起，让 AgPlayer 更好</p>
        <h1 id="support-title" style="font-size:clamp(32px,3.2vw,48px);margin:0 0 30px">支持 AgPlayer 开发迭代</h1>
        <p class="support-description">AgPlayer 将坚持永久免费、无广告。持续开发与维护需要时间，也需要设备适配和测试投入。如果它为你带来了便利，欢迎通过小额赞助支持后续开发。</p>
        <p class="support-use">你的支持将用于软件优化、功能迭代、多端适配与持续更新。</p>
        <div class="support-codes">
          <figure class="support-code wechat">
            <h3>微信支持</h3>
            <a class="qr-crop" href="assets/images/support-wechat-brand.png" target="_blank" rel="noopener" aria-label="查看完整微信收款码">
              <img src="assets/images/support-wechat-brand.png" alt="微信赞助收款二维码" decoding="async">
            </a>
            <figcaption><p>使用微信扫一扫</p></figcaption>
          </figure>
          <figure class="support-code alipay">
            <h3>支付宝支持</h3>
            <a class="qr-crop" href="assets/images/support-alipay-brand.jpg" target="_blank" rel="noopener" aria-label="查看完整支付宝收款码">
              <img src="assets/images/support-alipay-brand.jpg" alt="支付宝赞助收款二维码" decoding="async">
            </a>
            <figcaption><p>使用支付宝扫一扫</p></figcaption>
          </figure>
        </div>
        <p class="support-voluntary">赞助完全自愿，不绑定软件功能，也不提供专属特权。无论是否赞助，都可以免费使用 AgPlayer。支付由微信 / 支付宝提供，请在付款前自行确认收款信息和金额。</p>
        <p class="support-thanks">感谢每一份支持，也感谢你的使用与反馈。</p>
      </div>
    </section>
  </main>
</body>
</html>
