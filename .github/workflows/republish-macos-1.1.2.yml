name: Publish verified macOS 1.1.2 revision 20261027

on:
  push:
    branches: [main]
    paths: ['docs/releases/1.1.2-macos-republish-20261027.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r2-release-latest
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gddjag/AgPlayer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_republish_macos_112.py
      - run: pip install boto3 requests
      - name: Archive old Mac, verify all packages, replace Mac only, promote metadata
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python scripts/republish-macos-1.1.2.py
