name: Append verified Windows ARM64 to AgPlayer 1.1.2

on:
  push:
    branches: [main]
    paths: ['docs/releases/1.1.2-windows-arm64.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r2-release-latest
  cancel-in-progress: false

jobs:
  append:
    if: github.repository == 'gddjag/AgPlayer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify append and immutable sync logic
        run: node --test scripts/append-windows-arm64-1.1.2.test.mjs scripts/sync-release-r2.test.mjs
      - name: Verify original release and append only the ARM64 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/append-windows-arm64-1.1.2.mjs
      - name: Download and verify the complete four-installer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.1.2
        run: node scripts/sync-release-r2.mjs download
      - name: Reuse immutable installers and promote verified four-file metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          AWS_EC2_METADATA_DISABLED: 'true'
          RELEASE_TAG: v1.1.2
        run: node scripts/sync-release-r2.mjs upload
