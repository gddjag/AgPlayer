name: macOS existing-package installation check

# Validate the exact existing DMG without rebuilding application code.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-package-launch:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26, macos-15-intel, macos-26-intel, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-internal-adhoc-test
          path: package
          repository: ${{ github.repository }}
          run-id: 35462873521 # immutable DMG built from d94a54ce / local f949065e
          github-token: ${{ github.token }}
      - name: Audit the mounted DMG and launch the installed app
        shell: bash
        run: |
          sw_vers
          uname -m
          dmg_path="$(find package -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_path="$RUNNER_TEMP/agplayer-dmg"
          mkdir -p "$mount_path"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'launchctl unsetenv QT_QPA_PLATFORM; launchctl unsetenv QT_QUICK_BACKEND; hdiutil detach "$mount_path"' EXIT
          app_path="$mount_path/AgPlayer.app"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/AgPlayer")"
          for required_arch in x86_64 arm64; do
            printf '%s\n' "$architectures" | tr ' ' '\n' | grep -qx "$required_arch"
            lipo "$app_path/Contents/MacOS/AgPlayer" -thin "$required_arch" \
              -output "$RUNNER_TEMP/AgPlayer-$required_arch"
            # macdeployqt strips symbols; Qt plugin metadata remains in each slice.
            strings "$RUNNER_TEMP/AgPlayer-$required_arch" \
              | grep -F 'QDarwinMicrophonePermissionPlugin'
          done
          codesign --verify --deep --strict --all-architectures "$app_path"
          signature_log="$RUNNER_TEMP/agplayer-signatures.log"
          : >"$signature_log"
          native_count=0
          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q 'Mach-O'; then
              native_count=$((native_count + 1))
              details="$(codesign --display --verbose=4 "$candidate" 2>&1)"
              printf 'TARGET=%s\n%s\n' "${candidate#"$app_path"/}" "$details" >>"$signature_log"
              printf '%s\n' "$details" | grep -q '^Signature=adhoc$'
              printf '%s\n' "$details" | grep -q '^TeamIdentifier=not set$'
              code_directory="$(printf '%s\n' "$details" | grep '^CodeDirectory ')"
              case "$code_directory" in *runtime*) exit 1;; esac
            fi
          done < <(find "$app_path/Contents" -type f -print0)
          test "$native_count" -gt 0
          rm -rf /Applications/AgPlayer.app
          ditto "$app_path" /Applications/AgPlayer.app
          python3 - <<'PY'
          import json, subprocess
          worker = '/Applications/AgPlayer.app/Contents/MacOS/AgSeparationWorker'
          hello = json.dumps({'protocol': 2, 'requestId': 'installed-smoke', 'type': 'hello', 'payload': {}}) + '\n'
          result = subprocess.run([worker], input=hello, text=True, capture_output=True, timeout=15, check=True)
          messages = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
          assert any(message.get('type') == 'hello' and message.get('requestId') == 'installed-smoke' for message in messages), result.stdout + result.stderr
          print('Installed separation worker handshake: PASS')
          PY
          launchctl setenv QT_QPA_PLATFORM offscreen
          launchctl setenv QT_QUICK_BACKEND software
          open -W -n /Applications/AgPlayer.app --args --qa-test-mode \
            --qa-log "$RUNNER_TEMP/agplayer-installed.log" --qa-exit-after-ms 3000
          test -s "$RUNNER_TEMP/agplayer-installed.log"
      - name: Save installed launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}-installed-launch-log
          path: |
            ${{ runner.temp }}/agplayer-installed.log
            ${{ runner.temp }}/agplayer-signatures.log
          retention-days: 7
