name: macOS Universal development build

# Development artifacts only. Formal publication is separately authorized
# after the user's manual acceptance, via the requested release branch.
on:
  push:
    branches: [codex/macos-universal]
    paths-ignore: ['.github/workflows/macos-intel-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-universal-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure tool locations
        shell: bash
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/.cache/vcpkg/archives" >> "$GITHUB_ENV"
          echo "AGPLAYER_QT_ROOT=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/agplayer-tests"
          echo "TMPDIR=$(python -c 'import os; from pathlib import Path; print((Path(os.environ["RUNNER_TEMP"]) / "agplayer-tests").resolve())')" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/vcpkg/archives"
      - name: Restore Qt tools
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: macos-universal-qt${{ env.QT_VERSION }}
      - name: Restore compiled dependencies
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: macos-universal-13-qt${{ env.QT_VERSION }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/vcpkg-overlays/**') }}
      - name: Install build and test tools
        shell: bash
        run: |
          brew install cmake ninja pkg-config autoconf automake libtool nasm
          python -m pip install aqtinstall==3.3.0
          if [ ! -x "$AGPLAYER_QT_ROOT/bin/qt-cmake" ]; then
            python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -m qtshadertools -O "$RUNNER_TEMP/Qt"
          fi
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          baseline="$(python -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$baseline"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Preserve Qt tools for subsequent development builds
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: macos-universal-qt${{ env.QT_VERSION }}
      - name: Test packaging and target validation
        run: |
          python -m unittest discover -s tests/scripts -p 'test_package_macos.py' -v
          python -m unittest discover -s tests/python -p 'test_external_separation_worker.py' -v
          cmake -P tests/scripts/macos_target_contract_test.cmake
      - name: Configure both architectures and compile dependencies
        run: cmake --preset macos-universal-release -DBUILD_TESTING=ON
      - name: Preserve compiled dependencies before application compilation
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Build both architectures
        run: |
          cmake --build --preset macos-universal-release --parallel 3 -- -k 0
          cmake --build build/macos-universal --parallel 3 --target dependency_smoke_test c_api_lifecycle_test decoder_test audio_engine_test queue_gapless_test metadata_writer_test transcoder_test pitch_shifter_test waveform_cache_test project_document_test rename_transaction_test lyrics_provider_chain_test equalizer_controller_test separation_output_transaction_test lossless_analysis_controller_test qml_main_window_test application_file_open_test global_hotkey_manager_test settings_controller_test file_association_controller_test separation_runtime_test separation_native_backend_test separation_process_client_test vocal_separation_controller_test vocal_separation_install_test -- -k 0
      - name: Run focused native tests
        run: |
          ctest --test-dir build/macos-universal --output-on-failure \
          --output-junit macos-native-tests.xml \
          -R '^(dependency_smoke_test|c_api_lifecycle_test|decoder_test|audio_engine_test|queue_gapless_test|metadata_writer_test|transcoder_test|pitch_shifter_test|waveform_cache_test|project_document_test|rename_transaction_test|lyrics_provider_chain_test|equalizer_controller_test|separation_output_transaction_test|lossless_analysis_controller_test|qml_main_window_test|qml_macos_window_controls_test|application_file_open_test|global_hotkey_manager_test|settings_controller_test|file_association_controller_test|separation_runtime_test|separation_native_backend_test|separation_process_client_test|vocal_separation_controller_test|vocal_separation_install_test)$' &
          tests_pid=$!
          (
            for attempt in $(seq 1 45); do
              queue_pid=$(pgrep -f '/tests/queue_gapless_test( |$)' | head -n 1 || true)
              if [ -n "$queue_pid" ]; then
                sleep 10
                if kill -0 "$queue_pid" 2>/dev/null; then
                  /usr/bin/sample "$queue_pid" 3 -file "$RUNNER_TEMP/queue-gapless-sample.txt" || true
                fi
                break
              fi
              sleep 1
            done
          ) &
          observer_pid=$!
          set +e
          wait "$tests_pid"
          test_status=$?
          kill "$observer_pid" 2>/dev/null || true
          wait "$observer_pid" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/queue-gapless-sample.txt" ]; then
            head -n 210 "$RUNNER_TEMP/queue-gapless-sample.txt"
          fi
          if [ "$test_status" -eq 0 ]; then
            # These two tests previously failed intermittently on the Mac host.
            ctest --test-dir build/macos-universal --output-on-failure \
              -R '^(audio_engine_test|queue_gapless_test)$' --repeat until-fail:3
            test_status=$?
          fi
          exit "$test_status"
      - name: Deploy and audit a single Universal development package
        run: >-
          python scripts/package-macos.py
          --app build/macos-universal/app/AgPlayer.app
          --qt-root "$AGPLAYER_QT_ROOT"
          --output-dir build/macos-package
      - name: Archive the deployed app with executable bits and framework symlinks
        run: |
          app_path="build/macos-package/staging/AgPlayer.app"
          test -d "$app_path"
          test "$(uname -m)" = arm64
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            "$app_path/Contents/MacOS/AgPlayer" --qa-test-mode \
            --qa-log "$RUNNER_TEMP/agplayer-arm.log" --qa-exit-after-ms 3000
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/macos-package/AgPlayer-universal-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-development
          path: |
            build/macos-package/*.dmg
            build/macos-package/*.json
            build/macos-package/*.zip
          retention-days: 7
          if-no-files-found: error
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-test-logs
          path: |
            build/macos-universal/macos-native-tests.xml
            build/macos-universal/Testing/Temporary/LastTest.log
            build/macos-ui-titlebar-*.png
            build/macos-universal/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/agplayer-arm.log
            ${{ runner.temp }}/queue-gapless-sample.txt
          retention-days: 7

  installed-package-launch:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26, macos-15-intel, macos-26-intel, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-development
          path: package
      - name: Audit the mounted DMG and launch the installed app
        shell: bash
        run: |
          sw_vers
          uname -m
          dmg_path="$(find package -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_path="$RUNNER_TEMP/agplayer-dmg"
          mkdir -p "$mount_path"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'launchctl unsetenv QT_QPA_PLATFORM; launchctl unsetenv QT_QUICK_BACKEND; hdiutil detach "$mount_path"' EXIT
          app_path="$mount_path/AgPlayer.app"
          lipo "$app_path/Contents/MacOS/AgPlayer" -verify_arch x86_64 arm64
          codesign --verify --deep --strict --all-architectures "$app_path"
          signature_log="$RUNNER_TEMP/agplayer-signatures.log"
          : >"$signature_log"
          native_count=0
          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q 'Mach-O'; then
              native_count=$((native_count + 1))
              details="$(codesign --display --verbose=4 "$candidate" 2>&1)"
              printf 'TARGET=%s\n%s\n' "${candidate#"$app_path"/}" "$details" >>"$signature_log"
              printf '%s\n' "$details" | grep -q '^Signature=adhoc$'
              printf '%s\n' "$details" | grep -q '^TeamIdentifier=not set$'
              code_directory="$(printf '%s\n' "$details" | grep '^CodeDirectory ')"
              case "$code_directory" in *runtime*) exit 1;; esac
            fi
          done < <(find "$app_path/Contents" -type f -print0)
          test "$native_count" -gt 0
          rm -rf /Applications/AgPlayer.app
          ditto "$app_path" /Applications/AgPlayer.app
          launchctl setenv QT_QPA_PLATFORM offscreen
          launchctl setenv QT_QUICK_BACKEND software
          open -W -n /Applications/AgPlayer.app --args --qa-test-mode \
            --qa-log "$RUNNER_TEMP/agplayer-installed.log" --qa-exit-after-ms 3000
          test -s "$RUNNER_TEMP/agplayer-installed.log"
      - name: Save installed launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}-installed-launch-log
          path: |
            ${{ runner.temp }}/agplayer-installed.log
            ${{ runner.temp }}/agplayer-signatures.log
          retention-days: 7
