name: Repair legacy macOS update manifest v1.0.3

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Only the already published v1.0.3 manifest is accepted'
        required: true
        default: v1.0.3
        type: string

permissions:
  contents: read

concurrency:
  group: r2-release-latest
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifest-only repair
        run: node --test scripts/repair-macos-update-endpoint.test.mjs
      - name: Copy and verify the already published manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          AWS_EC2_METADATA_DISABLED: 'true'
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/repair-macos-update-endpoint.mjs
