<main id="main" class="listen-section listen-page-shell">
  <canvas class="sound-field listen-field" aria-hidden="true"></canvas>
  <div class="listen-main">
  <div class="listen-heading" id="waveforms">
    <h1 id="listen-title" data-i18n="listen.title">波形试听室</h1>
    <p data-i18n="listen.intro">点选图例切换波形，再添加本地音乐试听。音频只在你的设备上读取。</p>
  </div>
  <div class="wave-guide mode-tabs" role="tablist" data-i18n-aria="audioDemo.modeLabel" aria-label="波形样式">
    <button type="button" role="tab" id="mode-solid" data-mode="solid" aria-selected="true" aria-controls="audio-panel" aria-labelledby="mode-solid-name" aria-describedby="mode-solid-desc" tabindex="0">
      <canvas class="wave-swatch" data-wave-preview="solid" width="240" height="48" aria-hidden="true"></canvas>
      <span class="wave-guide-name" id="mode-solid-name" data-i18n="waveforms.solid.name">纯色波形</span>
      <span class="wave-guide-desc" id="mode-solid-desc" data-i18n="listen.solidGuide">波形高度显示声音强弱，橙色标出已播放的位置。</span>
    </button>
    <button type="button" role="tab" id="mode-frequency" data-mode="frequency" aria-selected="false" aria-controls="audio-panel" aria-labelledby="mode-frequency-name" aria-describedby="mode-frequency-desc" tabindex="-1">
      <canvas class="wave-swatch" data-wave-preview="frequency" width="240" height="48" aria-hidden="true"></canvas>
      <span class="wave-guide-name" id="mode-frequency-name" data-i18n="waveforms.frequency.name">频彩波形</span>
      <span class="wave-guide-desc" id="mode-frequency-desc" data-i18n="listen.frequencyGuide">红、绿、蓝三层分别显示低、中、高频的强弱。</span>
    </button>
    <button type="button" role="tab" id="mode-gradient" data-mode="gradient" aria-selected="false" aria-controls="audio-panel" aria-labelledby="mode-gradient-name" aria-describedby="mode-gradient-desc" tabindex="-1">
      <canvas class="wave-swatch" data-wave-preview="gradient" width="240" height="48" aria-hidden="true"></canvas>
      <span class="wave-guide-name" id="mode-gradient-name" data-i18n="waveforms.gradient.name">RGB 渐变</span>
      <span class="wave-guide-desc" id="mode-gradient-desc" data-i18n="listen.gradientGuide">已播放的波形沿时间轴呈现青、紫、粉渐变。</span>
    </button>
    <button type="button" role="tab" id="mode-spectrum" data-mode="spectrum" aria-selected="false" aria-controls="audio-panel" aria-labelledby="mode-spectrum-name" aria-describedby="mode-spectrum-desc" tabindex="-1">
      <canvas class="wave-swatch" data-wave-preview="spectrum" width="240" height="48" aria-hidden="true"></canvas>
      <span class="wave-guide-name" id="mode-spectrum-name" data-i18n="waveforms.spectrum.name">动态频谱</span>
      <span class="wave-guide-desc" id="mode-spectrum-desc" data-i18n="listen.spectrumGuide">频谱柱随当前声音起伏，顶部细线短暂保留峰值。</span>
    </button>
  </div>
  <div class="audio-demo" id="audio-demo" aria-busy="false">
    <div class="listen-toolbar">
      <label class="file-picker" for="audio-file"><span data-i18n="audioDemo.chooseFile">＋ 添加本地音乐</span><input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.wma"></label>
    </div>
    <div class="listen-track">
      <span id="audio-filename" data-i18n="audioDemo.empty.label">选择一首本地音乐</span>
      <span id="audio-time">00:00 / 00:00</span>
    </div>
    <div class="listen-row">
      <button type="button" class="play-button" id="audio-play" disabled data-i18n-aria="audioDemo.play" aria-label="播放"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path class="listen-play-mark" d="M7 3.8v16.4L21 12z"/><path class="listen-pause-mark" d="M5 4h5v16H5zM14 4h5v16h-5z"/></svg></button>
      <div id="audio-panel" role="tabpanel" aria-labelledby="mode-solid" class="audio-surface">
        <div class="audio-visual">
          <canvas id="audio-canvas" aria-hidden="true"></canvas>
          <span class="audio-placeholder" id="audio-placeholder" data-i18n="audioDemo.empty.description">音频将在这里呈现</span>
        </div>
      </div>
    </div>
    <label class="listen-visually-hidden" for="audio-seek" data-i18n="audioDemo.seek">播放进度</label>
    <input type="range" id="audio-seek" min="0" max="1000" step="1" value="0" disabled aria-valuetext="00:00 / 00:00">
    <p class="audio-status" id="audio-status" role="status" aria-live="polite"></p>
    <audio id="local-audio" preload="metadata"></audio>
  </div>
  <div class="listen-foot">
    <p data-i18n="audioDemo.formatNote">网页试听支持的格式取决于浏览器，与桌面播放器可能不同。</p>
    <a href="/assets/Beach_Voxel_Festival.html" target="_blank" rel="noopener"><span data-i18n="audioDemo.immersiveStage">沉浸式舞台</span><span aria-hidden="true">↗</span></a>
  </div>
  </div>
</main>

  </div></footer>

    <symbol id="ag-icon-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ag-icon-play" viewBox="0 0 24 24"><path d="M7 3v18l15-9z" fill="currentColor"/></symbol>
    <symbol id="ag-icon-pause" viewBox="0 0 24 24"><path d="M5 3h5v18H5zM15 3h5v18h-5z" fill="currentColor"/></symbol>
  </defs></svg>
